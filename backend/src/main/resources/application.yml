# ═══════════════════════════════════════════════════════════
#  SYNAPSE COUNCIL — Application Configuration
# ═══════════════════════════════════════════════════════════

server:
  port: 8080
  servlet:
    context-path: /

# Import agent configuration
spring.config.import: optional:classpath:agents-config.yml


spring:
  application:
    name: synapse-council
  threads:
    virtual:
      enabled: true

  # ─── Database ──────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:h2:mem:synapse_council;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
    open-in-view: false

  # ─── Redis ─────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 5000ms

  # ─── Jackson ───────────────────────────────────────────
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSZ

  # ─── File Upload ───────────────────────────────────────
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

# ─── Security (disabled for Phase 1) ──────────────────────
security:
  enabled: false

# ─── NVIDIA NIM Configuration ────────────────────────────
nvidia:
  nim:
    base-url: https://integrate.api.nvidia.com/v1
    timeout: 60000
    max-retries: 5
    retry-backoff-base: 1000
    retryable-status-codes: 429,500,502,503,504

# ─── Qdrant Configuration ───────────────────────────────
qdrant:
  host: ${QDRANT_HOST:localhost}
  port: ${QDRANT_PORT:6333}
  grpc-port: ${QDRANT_GRPC_PORT:6334}

# ─── MinIO Configuration ────────────────────────────────
minio:
  endpoint: http://${MINIO_HOST:localhost}:${MINIO_PORT:9000}
  access-key: ${MINIO_ACCESS_KEY:synapse_admin}
  secret-key: ${MINIO_SECRET_KEY:synapse_minio_2026}
  bucket: synapse-uploads

# ─── Actuator & Monitoring ──────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: synapse-council

# ─── Logging ────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.synapse.council: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
