nvidia:
  nim:
    base-url: https://integrate.api.nvidia.com/v1
    api-key: ${NVIDIA_API_KEY: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}
    api-keys:
      - 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
      - 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
      - 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
      - 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
    max-tokens: 1024
    temperature: 0.7
    timeout-ms: 45000
    rate-limit:
      requests-per-minute: 38
      window-seconds: 60
      batch-size: 2
      batch-delay-ms: 4000
    retry:
      max-retries: 2
      backoff-base-ms: 1500
      retryable-status-codes: [429, 500, 502, 503, 504]

boardroom:
  total-rounds: 4
  min-agents-per-discussion: 3
  max-agents-per-discussion: 10
  consensus-threshold: 0.75

